<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="140" viewBox="0 0 600 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Enhanced gradient with better contrast -->
    <linearGradient id="goldGradient" x1="0" y1="0" x2="600" y2="140">
      <stop offset="0%" stop-color="#D4B48D"/>
      <stop offset="50%" stop-color="#C4A47D"/>
      <stop offset="100%" stop-color="#8B6B47"/>
    </linearGradient>
    
    <!-- Refined glow effect -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
      <feColorMatrix type="matrix" values="1 0 0 0 0.768627451 0 1 0 0 0.643137255 0 0 1 0 0.490196078 0 0 0 0.5 0"/>
    </filter>

    <!-- Sharp edges filter -->
    <filter id="sharpen">
      <feConvolveMatrix order="3" kernelMatrix="-1 -1 -1 -1 9 -1 -1 -1 -1"/>
    </filter>
  </defs>

  <!-- Main text with enhanced styling -->
  <text x="300" y="85" text-anchor="middle" font-family="serif" font-size="96" font-weight="bold" 
        fill="url(#goldGradient)" filter="url(#sharpen)" 
        style="paint-order: stroke; stroke: #2C2620; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round;">
    <tspan x="300" dy="0">MexxMedia</tspan>
  </text>

  <!-- Enhanced decorative underline -->
  <path d="M120 105 L480 105" stroke="url(#goldGradient)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
</svg> 